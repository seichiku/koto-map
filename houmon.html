let cat=1, own='全院';

for(const o of OWN){
  L.circle([o[1],o[2]],{radius:500,color:'#1d34a8',weight:1.5,dashArray:'5 5',fill:true,fillColor:'#1d34a8',fillOpacity:0.04,interactive:false}).addTo(map);

}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function pop(p){
  return '<b class="tn">'+esc(p.n)+'</b>'+(p.k?' <span class="badge">'+(p.b||'開拓済み')+'</span>':'')+'<br>'+esc(p.s)+(p.a?'　江東区'+esc(p.a):'')
   +(p.m?'<br>'+esc(p.m):'')+(p.r?'<br>代表者：'+esc(p.r):'')+(p.t?'<br>電話：<a href="tel:'+p.t.replace(/[^0-9]/g,'').slice(0,11)+'">'+esc(p.t)+'</a>':'')+'<br>最寄り：'+p.o+'院から約'+p.d+'m'
   +'<br><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.n+' 江東区'+(p.a||''))+'">Googleマップで開く</a>';
}
const group=L.layerGroup().addTo(map); let markers=[];
function draw(){
  group.clearLayers(); markers=[];
  const C=CATS[cat];
  const list=POINTS.filter(p=>p.c===cat&&(own==='全院'||p.o===own));
  list.forEach((p,i)=>{
    let m;
    if(p.k){
      m=L.marker([p.lat,p.lng],{icon:L.divIcon({className:'',html:'<div style="width:26px;height:26px;border-radius:50%;background:#0d8a4f;color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;border:2.5px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45)">✓</div>',iconSize:[26,26],iconAnchor:[13,13]}),zIndexOffset:400});
      m.bindTooltip(p.n,{permanent:true,direction:'right',offset:[13,0]});
    }else{
      m=L.circleMarker([p.lat,p.lng],{radius:p.d<=500?8:6,color:'#fff',weight:2,fillColor:C.color,fillOpacity:p.d<=500?0.95:0.6});
      m.bindTooltip(p.n);
    }
    m.bindPopup(()=>pop(p),{maxWidth:280}).addTo(group); markers.push(m);
  });
  document.getElementById('ttitle').textContent=C.title+'（'+list.length+'件）';
  document.getElementById('tlist').innerHTML=list.map((p,i)=>'<div class="titem" data-i="'+i+'"><span class="dot" style="background:'+(p.k?'#0d8a4f':C.color)+';margin-top:3px;flex:none"></span><div><b>'+esc(p.n)+'</b>'+(p.k?' <span class="badge">'+(p.b||'開拓済み')+'</span>':'')+'<br><span class="tmeta">'+esc(p.s)+'・'+p.o+'院から約'+p.d+'m'+(p.m?'<br>'+esc(p.m):'')+(p.r?'<br>'+esc(p.r):'')+(p.t?'<br>☎ '+esc(p.t):'')+'</span></div></div>').join('')||'<div style="padding:12px;color:#888">該当なし</div>';
  document.querySelectorAll('#mc button').forEach(b=>{const on=+b.dataset.c===cat;b.classList.toggle('on',on);b.style.background=on?CATS[b.dataset.c].color:'#fff';b.style.borderColor=on?CATS[b.dataset.c].color:'#ccc';});
  document.querySelectorAll('#tsub button').forEach(b=>b.classList.toggle('on',b.dataset.o===own));
  legend.update();
}
document.getElementById('mc').innerHTML=Object.keys(CATS).map(k=>'<button data-c="'+k+'">'+CATS[k].label+'</button>').join('');
document.getElementById('tsub').innerHTML=['全院','南砂','東砂','塩浜'].map(o=>'<button data-o="'+o+'">'+o+'</button>').join('');
document.getElementById('mc').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;cat=+b.dataset.c;draw();});
document.getElementById('tsub').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;own=b.dataset.o;draw();
  const o=OWN[['南砂','東砂','塩浜'].indexOf(own)]; if(o)map.flyTo([o[1],o[2]],16,{duration:0.6}); else map.flyTo([35.672,139.826],15,{duration:0.6});});
document.getElementById('tlist').addEventListener('click',e=>{const it=e.target.closest('.titem');if(!it)return;const m=markers[+it.dataset.i];map.flyTo(m.getLatLng(),17,{duration:0.7});setTimeout(()=>m.openPopup(),800);});
document.getElementById('tpanel-toggle').addEventListener('click',()=>document.getElementById('tpanel').classList.toggle('closed'));
const legend=L.control({position:'bottomleft'});
legend.onAdd=function(){this._div=L.DomUtil.create('div','lgd');return this._div;};
legend.update=function(){const c=CATS[cat].color;this._div.innerHTML='<span style="color:#1d34a8;font-size:14px">★</span> 成竹3院（点線＝500m）<br><span class="dot" style="background:#0d8a4f"></span> 開拓済み・加入済み<br><span class="dot" style="background:'+c+'"></span> 500m以内（優先）<br><span class="dot" style="background:'+c+';opacity:.55"></span> 500m〜1.2km';};
legend.addTo(map);
